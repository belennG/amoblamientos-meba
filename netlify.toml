[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits fully static HTML, so Netlify's form-detection bot picks up
# the <form data-netlify="true"> in the built output automatically.
# The email notification to amoblamientosmeba@hotmail.com is configured once
# in the Netlify UI: Site settings → Forms → Form notifications → Email.

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
